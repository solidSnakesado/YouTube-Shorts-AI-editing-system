[project]
name = "yt-shorts-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "fastapi>=0.135.3",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "librosa>=0.11.0",
    "loguru>=0.7.3",
    "moviepy>=2.2.1",
    "opencv-python-headless>=4.13.0.92",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pydub>=0.25.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "rich>=14.3.3",
    "scenedetect>=0.6.7.1",
    "sqlalchemy>=2.0.49",
    "sqlmodel>=0.0.38",
    "ultralytics>=8.4.33",
    "uvicorn[standard]>=0.43.0",
    "yt-dlp>=2026.3.17",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "logs*", "temp*", "models*", "outputs*", "tests*"]
