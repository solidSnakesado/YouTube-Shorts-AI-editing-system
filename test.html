<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Shorts AI — Pipeline Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0f; color: #e2e8f0; font-family: 'JetBrains Mono', 'Noto Sans KR', monospace; padding: 24px; min-height: 100vh; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #1a1a2e; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  h1 { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #6366f1, #a78bfa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
  .subtitle { color: #64748b; font-size: 13px; text-align: center; margin-top: 4px; }
  .container { max-width: 960px; margin: 24px auto; display: flex; flex-direction: column; gap: 16px; }
  .card { background: #111827; border-radius: 12px; padding: 20px; border: 1px solid #1e293b; }
  .card-title { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 14px; font-size: 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-family: inherit; }
  input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.2); }
  .btn { padding: 10px 20px; font-size: 13px; font-weight: 700; font-family: inherit; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.1s, opacity 0.1s; white-space: nowrap; }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
  .btn-secondary { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; }
  .step-btn { flex: 1; min-width: 105px; padding: 12px 6px; font-size: 11px; font-family: inherit; font-weight: 600; background: #0f172a; border: 1px solid #334155; border-radius: 8px; cursor: pointer; color: #94a3b8; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.15s; }
  .step-btn.done { background: rgba(99,102,241,0.12); border-color: #6366f1; color: #a5b4fc; }
  .step-btn .num { width: 22px; height: 22px; border-radius: 50%; font-size: 11px; display: flex; align-items: center; justify-content: center; background: #1e293b; color: #64748b; }
  .step-btn.done .num { background: #6366f1; color: white; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  .loading .num { animation: pulse 1.2s infinite; }
  .flex-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .flex-1 { flex: 1; min-width: 260px; }
  .flex-2 { flex: 2; min-width: 340px; }
  .info-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
  .info-label { font-size: 12px; color: #94a3b8; }
  code { font-size: 11px; color: #cbd5e1; background: #0f172a; padding: 2px 8px; border-radius: 4px; }
  .badge { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; }
  .short-btn { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: 12px; font-family: inherit; background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; cursor: pointer; color: #e2e8f0; transition: all 0.1s; width: 100%; margin-bottom: 6px; }
  .short-btn.active { background: rgba(99,102,241,0.1); border-color: #6366f1; }
  .short-num { font-size: 10px; font-weight: 700; color: #6366f1; background: rgba(99,102,241,0.15); padding: 2px 8px; border-radius: 4px; }
  .score { color: #f59e0b; font-size: 11px; }
  .error-bar { background: rgba(239,68,68,0.1); border: 1px solid #7f1d1d; border-radius: 8px; padding: 10px 16px; font-size: 13px; color: #fca5a5; display: flex; justify-content: space-between; align-items: center; }
  .log-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid #1e293b; }
  .log-body { height: 260px; overflow-y: auto; padding: 8px 16px; }
  .log-line { font-size: 12px; padding: 3px 0; }
  .log-ts { color: #475569; margin-right: 8px; }
  .log-info { color: #94a3b8; } .log-request { color: #60a5fa; } .log-success { color: #4ade80; } .log-error { color: #f87171; }
  .empty { font-size: 13px; color: #475569; }
</style>
</head>
<body>

<h1>YT Shorts AI</h1>
<p class="subtitle">유튜브 영상 → 쇼츠 자동 생성 파이프라인 테스트</p>

<!-- 탭 네비게이션 -->
<div style="display:flex;justify-content:center;gap:8px;margin-top:16px">
  <button class="btn btn-primary" id="tabPipeline" onclick="switchTab('pipeline')" style="font-size:12px;padding:8px 20px">🎬 쇼츠 파이프라인</button>
  <button class="btn btn-secondary" id="tabHeatmap" onclick="switchTab('heatmap')" style="font-size:12px;padding:8px 20px">🔥 히트맵 수집</button>
</div>

<!-- 파이프라인 탭 -->
<div class="container" id="pipelineTab">

  <!-- 입력 -->
  <div class="card">
    <div class="row">
      <div style="flex:1;min-width:280px">
        <label>YouTube URL</label>
        <input id="urlInput" placeholder="https://youtu.be/..." />
      </div>
      <div style="width:100px">
        <label>쇼츠 수</label>
        <input id="maxShorts" type="number" value="3" min="1" max="10" style="text-align:center" />
      </div>
      <div style="width:110px">
        <label>길이(초)</label>
        <input id="targetDuration" type="number" placeholder="자동" min="10" max="60"
          style="text-align:center" title="10~60초 입력 시 해당 길이로 생성, 비워두면 AI 자동 결정" />
      </div>
      <div style="width:110px">
        <label>종횡비</label>
        <select id="aspectRatio" style="width:100%;padding:10px 8px;font-size:13px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-family:inherit">
          <option value="9:16">9:16 쇼츠</option>
          <option value="16:9">16:9 가로</option>
          <option value="1:1">1:1 정사각</option>
          <option value="4:5">4:5</option>
          <option value="4:3">4:3</option>
          <option value="16:10">16:10</option>
        </select>
      </div>
      <div style="display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:2px">
        <label style="margin-bottom:8px">제목 삽입</label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:#a5b4fc;padding:8px 0">
          <input type="checkbox" id="withTitle" checked
            style="width:16px;height:16px;accent-color:#6366f1;cursor:pointer" />
          <span id="withTitleLabel">ON</span>
        </label>
      </div>
      <div style="width:120px">
        <label>레이아웃</label>
        <select id="layoutMode" style="width:100%;padding:10px 8px;font-size:13px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-family:inherit"
          title="crop: YOLO 피사체 추적 크롭 | letterbox: 블러 배경 레터박스">
          <option value="crop">✂ 크롭</option>
          <option value="letterbox">🖼 레터박스</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="runAll()">▶ 전체 실행</button>
      <button class="btn btn-secondary" onclick="resetAll()">↺ 초기화</button>
    </div>
  </div>

  <!-- 파이프라인 스텝 -->
  <div class="card">
    <div class="card-title">Pipeline Steps</div>
    <div class="steps" id="stepsContainer"></div>
  </div>

  <!-- 상태 + 쇼츠 -->
  <div class="flex-row">
    <div class="card flex-1">
      <div class="card-title">Project</div>
      <div id="projectInfo"><p class="empty">프로젝트를 생성하세요</p></div>
    </div>
    <div class="card flex-2">
      <div class="card-title">Shorts (<span id="shortsCount">0</span>)</div>
      <div id="shortsList"><p class="empty">하이라이트 추출 후 표시됩니다</p></div>
    </div>
  </div>

  <!-- 에러 -->
  <div id="errorBar" class="error-bar" style="display:none">
    <span id="errorMsg"></span>
    <button onclick="hideError()" style="background:none;border:none;color:#fca5a5;cursor:pointer;font-size:16px">×</button>
  </div>

  <!-- 로그 -->
  <div class="card" style="padding:0;overflow:hidden">
    <div class="log-header">
      <span class="card-title" style="margin:0">Log <span id="loadingDot" style="display:none;color:#f59e0b">● 처리 중...</span></span>
      <button class="btn btn-secondary" style="padding:2px 10px;font-size:11px" onclick="clearLog()">Clear</button>
    </div>
    <div class="log-body" id="logBody">
      <div class="log-line log-info">유튜브 URL을 입력하고 실행하세요...</div>
    </div>
  </div>

</div><!-- /pipelineTab -->

<!-- 히트맵 수집 탭 -->
<div class="container" id="heatmapTab" style="display:none">

  <!-- 모드 선택 -->
  <div class="card">
    <div class="card-title">수집 모드</div>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button class="btn btn-primary" id="hmModeSingle" onclick="setHmMode('single')" style="font-size:12px">단일 URL</button>
      <button class="btn btn-secondary" id="hmModeChannel" onclick="setHmMode('channel')" style="font-size:12px">채널/재생목록</button>
    </div>

    <!-- 단일 URL 입력 -->
    <div id="hmSingleInput">
      <div class="row">
        <div style="flex:1;min-width:280px">
          <label>YouTube URL</label>
          <input id="hmUrl" placeholder="https://www.youtube.com/watch?v=..." />
        </div>
        <button class="btn btn-primary" onclick="hmCollectSingle()">수집</button>
      </div>
    </div>

    <!-- 채널 URL 입력 -->
    <div id="hmChannelInput" style="display:none">
      <div class="row" style="margin-bottom:12px">
        <div style="flex:1;min-width:280px">
          <label>채널 / 재생목록 URL</label>
          <input id="hmChannelUrl" placeholder="https://www.youtube.com/@채널명/videos" />
        </div>
        <div style="width:100px">
          <label>최대 영상 수</label>
          <input id="hmMaxVideos" type="number" value="50" min="1" max="500" style="text-align:center" />
        </div>
        <button class="btn btn-secondary" onclick="hmExtractUrls()">URL 추출</button>
      </div>
      <div id="hmUrlList" style="display:none;margin-bottom:12px">
        <label>추출된 URL (<span id="hmUrlCount">0</span>개)</label>
        <textarea id="hmUrlTextarea" style="width:100%;height:120px;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:10px;font-family:inherit;font-size:12px;resize:vertical"></textarea>
        <div style="margin-top:8px;display:flex;gap:8px">
          <button class="btn btn-primary" onclick="hmCollectBatch()">🔥 일괄 수집 시작</button>
          <div style="font-size:11px;color:#94a3b8;display:flex;align-items:center">
            Rate limit: <input id="hmRateLimit" type="number" value="2" min="0.5" max="10" step="0.5" style="width:50px;text-align:center;margin:0 4px;padding:4px;font-size:11px">초
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 수집 진행/결과 -->
  <div class="card">
    <div class="card-title">수집 진행 상황</div>
    <div id="hmProgress"><p class="empty">수집을 시작하세요</p></div>
  </div>

  <!-- 수집된 파일 목록 -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span class="card-title" style="margin:0">저장된 데이터 파일</span>
      <button class="btn btn-secondary" style="padding:4px 12px;font-size:11px" onclick="hmLoadFiles()">새로고침</button>
    </div>
    <div id="hmFiles"><p class="empty">로딩 중...</p></div>
  </div>

  <!-- 히트맵 로그 -->
  <div class="card" style="padding:0;overflow:hidden">
    <div class="log-header">
      <span class="card-title" style="margin:0">Heatmap Log <span id="hmLoadingDot" style="display:none;color:#f59e0b">● 처리 중...</span></span>
      <button class="btn btn-secondary" style="padding:2px 10px;font-size:11px" onclick="document.getElementById('hmLogBody').innerHTML=''">Clear</button>
    </div>
    <div class="log-body" id="hmLogBody">
      <div class="log-line log-info">히트맵 수집 모드입니다...</div>
    </div>
  </div>

</div><!-- /heatmapTab -->

<script>
const API = `${window.location.protocol}//${window.location.hostname}:8000/api/v1`;
const STEPS = [
  { id:1, label:"프로젝트 생성", ep:"create", desc:"유튜브 URL로 프로젝트 생성" },
  { id:2, label:"다운로드",     ep:"download", desc:"yt-dlp + 오디오 추출" },
  { id:3, label:"전사",         ep:"transcribe", desc:"Whisper 음성→텍스트" },
  { id:4, label:"하이라이트",    ep:"analyze", desc:"LLM 하이라이트 추출" },
  { id:5, label:"리프레이밍",    ep:"edit", desc:"YOLO + 크롭" },
  { id:6, label:"자막(보류)",    ep:"subtitle", desc:"ASS 카라오케 자막 (보류)", skip:true },
  { id:7, label:"인코딩",       ep:"encode", desc:"NVENC 최종 출력" },
];
const STATUS_CLR = { pending:"#6b7280", downloading:"#3b82f6", analyzing:"#8b5cf6", editing:"#f59e0b", completed:"#10b981", failed:"#ef4444", queued:"#6b7280", reframing:"#3b82f6", encoding:"#f59e0b" };

let state = { projectId:null, projectStatus:null, shorts:[], activeIdx:0, currentStep:0, loading:false };

// 초기 스텝 버튼 렌더링
function renderSteps() {
  const c = document.getElementById("stepsContainer");
  c.innerHTML = STEPS.map(s => `
    <button class="step-btn" id="step${s.id}" onclick="runStep(${s.id})" title="${s.desc}">
      <span class="num">${s.id}</span><span>${s.label}</span>
    </button>
  `).join("");
}

function updateStepUI() {
  STEPS.forEach(s => {
    const el = document.getElementById(`step${s.id}`);
    el.className = `step-btn${state.currentStep >= s.id ? " done" : ""}${state.loading && state.currentStep === s.id - 1 ? " loading" : ""}`;
    el.querySelector(".num").textContent = state.currentStep >= s.id ? "✓" : s.id;
    el.disabled = state.loading;
  });
}

function renderProject() {
  const el = document.getElementById("projectInfo");
  if (!state.projectId) { el.innerHTML = '<p class="empty">프로젝트를 생성하세요</p>'; return; }
  const c = STATUS_CLR[state.projectStatus] || "#6b7280";
  el.innerHTML = `
    <div class="info-row"><span class="info-label">ID</span><code>${state.projectId.slice(0,12)}...</code></div>
    <div class="info-row"><span class="info-label">상태</span><span class="badge" style="background:${c}22;color:${c}">${state.projectStatus}</span></div>
  `;
}

function renderShorts() {
  document.getElementById("shortsCount").textContent = state.shorts.length;
  const el = document.getElementById("shortsList");
  if (!state.shorts.length) { el.innerHTML = '<p class="empty">하이라이트 추출 후 표시됩니다</p>'; return; }
  el.innerHTML = state.shorts.map((s, i) => {
    const c = STATUS_CLR[s.status] || "#6b7280";
    const canResize = s.output_path && s.status !== "failed";
    return `<button class="short-btn${i === state.activeIdx ? " active" : ""}" onclick="selectShort(${i})">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="short-num">#${i+1}</span>
        <span>${s.start_sec?.toFixed(1)}s – ${s.end_sec?.toFixed(1)}s</span>
        ${s.hook_score != null ? `<span class="score">★ ${s.hook_score.toFixed(2)}</span>` : ""}
        ${s.aspect_ratio ? `<span style="font-size:9px;color:#a78bfa;background:rgba(167,139,250,0.12);padding:1px 6px;border-radius:3px">${s.aspect_ratio}</span>` : ""}
      </div>
      <div style="font-size:10px;color:#94a3b8;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:400px">${s.highlight_reason || s.title_suggestion || ""}</div>
      <div style="display:flex;align-items:center;gap:6px">
        ${canResize ? `<select class="resize-sel" id="resizeSel${i}" onclick="event.stopPropagation()" style="padding:3px 6px;font-size:10px;background:#0f172a;border:1px solid #334155;border-radius:4px;color:#94a3b8;font-family:inherit">
          <option value="16:9">16:9</option><option value="9:16">9:16</option><option value="1:1">1:1</option>
          <option value="4:5">4:5</option><option value="4:3">4:3</option><option value="16:10">16:10</option>
        </select><button class="btn btn-secondary" onclick="event.stopPropagation();resizeShort(${i})" style="padding:3px 8px;font-size:10px">리사이즈</button>` : ""}
        <button onclick="event.stopPropagation();submitFeedback(${i},'ok')" style="padding:3px 8px;font-size:11px;background:${s.feedback==='ok'?'rgba(34,197,94,0.25)':'#0f172a'};border:1px solid ${s.feedback==='ok'?'#22c55e':'#334155'};border-radius:4px;cursor:pointer">👍</button>
        <select id="fbReason${i}" onclick="event.stopPropagation()" style="padding:3px 4px;font-size:10px;background:#0f172a;border:1px solid #334155;border-radius:4px;color:#94a3b8;font-family:inherit">
          <option value="selection">선택</option><option value="boundary">경계</option><option value="editing">편집</option>
        </select>
        <button onclick="event.stopPropagation();submitFeedback(${i},'no')" style="padding:3px 8px;font-size:11px;background:${s.feedback==='no'?'rgba(239,68,68,0.25)':'#0f172a'};border:1px solid ${s.feedback==='no'?'#ef4444':'#334155'};border-radius:4px;cursor:pointer">👎</button>
        ${s.feedback ? `<span style="font-size:9px;color:${s.feedback==='ok'?'#22c55e':'#ef4444'}">${s.feedback}${s.feedback_reason?` (${s.feedback_reason})`:""}</span>` : ""}
        <span class="badge" style="background:${c}22;color:${c}">${s.status}</span>
      </div>
    </button>`;
  }).join("");
}

function selectShort(i) { state.activeIdx = i; renderShorts(); }

// 33일차: 피드백 루프 B - OK/NO 피드백 제출 (POST /shorts/{id}/feedback)
async function submitFeedback(i, fb) {
  const s = state.shorts[i];
  if (!s?.id) { showError("쇼츠 정보가 없습니다"); return; }
  const body = { feedback: fb };
  if (fb === "no") body.feedback_reason = document.getElementById(`fbReason${i}`)?.value || "selection";
  addLog(`[피드백] #${i+1} → ${fb}${body.feedback_reason ? ` (${body.feedback_reason})` : ""}`);
  const d = await apiCall(`${API}/shorts/${s.id}/feedback`, { method:"POST", body: JSON.stringify(body) });
  if (d) { state.shorts = state.shorts.map(x => x.id === s.id ? d : x); addLog(`피드백 저장됨: ${d.feedback}${d.feedback_reason ? ` (${d.feedback_reason})` : ""}`, "success"); renderShorts(); }
}

function addLog(msg, type="info") {
  const ts = new Date().toLocaleTimeString("ko-KR");
  const el = document.getElementById("logBody");
  el.innerHTML += `<div class="log-line log-${type}"><span class="log-ts">${ts}</span>${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function clearLog() { document.getElementById("logBody").innerHTML = ""; }
function showError(msg) { document.getElementById("errorMsg").textContent = "⚠ " + msg; document.getElementById("errorBar").style.display = "flex"; }
function hideError() { document.getElementById("errorBar").style.display = "none"; }
function setLoading(v) { state.loading = v; document.getElementById("loadingDot").style.display = v ? "inline" : "none"; updateStepUI(); }

async function apiCall(url, opts={}) {
  setLoading(true); hideError();
  try {
    addLog(`→ ${opts.method||"GET"} ${url}`, "request");
    const res = await fetch(url, { headers: {"Content-Type":"application/json"}, ...opts });
    const data = await res.json();
    if (!res.ok) { const e = data.detail || JSON.stringify(data); addLog(`✗ ${res.status}: ${e}`, "error"); showError(e); return null; }
    addLog(`✓ ${res.status} OK`, "success");
    return data;
  } catch(e) { addLog(`✗ 네트워크 오류: ${e.message}`, "error"); showError(e.message); return null; }
  finally { setLoading(false); }
}

async function runStep(id) {
  if (id === 1) {
    const url = document.getElementById("urlInput").value.trim();
    if (!url) { showError("유튜브 URL을 입력하세요"); return; }
    addLog(`[Step 1] 프로젝트 생성: ${url}`);
    const d = await apiCall(`${API}/projects/`, { method:"POST", body: JSON.stringify({ youtube_url: url, max_shorts: +document.getElementById("maxShorts").value }) });
    if (d) { state.projectId = d.id; state.projectStatus = d.status; state.currentStep = 1; addLog(`프로젝트 ID: ${d.id}`, "success"); renderProject(); updateStepUI(); }
  } else if (id <= 4) {
    if (!state.projectId) { showError("먼저 프로젝트를 생성하세요"); return; }
    addLog(`[Step ${id}] ${STEPS[id-1].label} 실행 중...`);
    const td = document.getElementById("targetDuration").value.trim();
    const tdParam = (id === 4 && td) ? `&target_duration_sec=${td}` : "";
    const suffix = id === 4 ? `?max_shorts=${document.getElementById("maxShorts").value}${tdParam}` : "";
    if (id === 4 && td) addLog(`  쇼츠 길이: ${td}초 (사용자 지정)`, "info");
    const d = await apiCall(`${API}/projects/${state.projectId}/${STEPS[id-1].ep}${suffix}`, { method:"POST" });
    if (d) {
      if (id === 4 && d.items) { state.shorts = d.items; state.activeIdx = 0; addLog(`쇼츠 ${d.total}개 생성됨`, "success"); d.items.forEach((s,i) => { addLog(`  #${i+1} ${s.start_sec?.toFixed(1)}-${s.end_sec?.toFixed(1)}s | score: ${s.hook_score} | 비율: ${s.aspect_ratio || "9:16"}`); if (s.highlight_reason) addLog(`     이유: ${s.highlight_reason}`, "info"); if (s.title_suggestion) addLog(`     제목: ${s.title_suggestion}`, "info"); }); renderShorts();
        // AI 추천 비율을 드롭다운 기본값으로 설정 (첫 번째 쇼츠 기준)
        const aiAr = d.items[0]?.aspect_ratio;
        if (aiAr) { const sel = document.getElementById("aspectRatio"); for (let o of sel.options) { if (o.value === aiAr) { sel.value = aiAr; break; } } addLog(`AI 추천 종횡비: ${aiAr} (드롭다운 자동 설정)`, "info"); }
      }
      state.projectStatus = d.status || state.projectStatus; state.currentStep = id; renderProject(); updateStepUI();
    }
  } else {
    if (!state.shorts.length) { showError("먼저 하이라이트 추출을 실행하세요"); return; }
    const sid = state.shorts[state.activeIdx]?.id;
    if (!sid) return;
    addLog(`[Step ${id}] ${STEPS[id-1].label} — 쇼츠 #${state.activeIdx+1} (${sid.slice(0,8)}...)`);
    if (STEPS[id-1].skip) { addLog(`  → 보류 기능이므로 건너뜁니다`, "info"); return; }
    let epSuffix = "";
    if (id === 5) {
      const userAr = document.getElementById("aspectRatio").value;
      const aiAr = state.shorts[state.activeIdx]?.aspect_ratio;
      const ar = userAr || aiAr || "9:16";
      const layout = document.getElementById("layoutMode").value;
      epSuffix = `?aspect_ratio=${ar}&layout=${layout}`;
      addLog(`  종횡비: ${ar}${aiAr && ar === aiAr ? " (AI 추천)" : " (사용자 지정)"} | 레이아웃: ${layout === "crop" ? "✂ 크롭" : "🖼 레터박스"}`, "info");
    }
    if (id === 7) {
      // 26일차: 제목 삽입 여부 파라미터 전달
      const withTitle = document.getElementById("withTitle").checked;
      epSuffix = `?with_title=${withTitle}`;
      addLog(`  제목 삽입: ${withTitle ? "ON ✦ 영상에 제목 오버레이" : "OFF"}`, "info");
    }
    const d = await apiCall(`${API}/shorts/${sid}/${STEPS[id-1].ep}${epSuffix}`, { method:"POST" });
    if (d) { state.shorts = state.shorts.map(s => s.id === sid ? d : s); state.currentStep = id; if (d.status === "completed") addLog(`최종 출력: ${d.output_path}`, "success"); renderShorts(); updateStepUI(); }
  }
}

async function runAll() {
  // Step 1~4: 프로젝트 단위 (1회 실행)
  for (let i = 1; i <= 4; i++) { await runStep(i); if (document.getElementById("errorBar").style.display !== "none") return; }
  // Step 5~7: 각 쇼츠별 반복 실행
  for (let si = 0; si < state.shorts.length; si++) {
    state.activeIdx = si; renderShorts();
    addLog(`\n━━━ 쇼츠 #${si+1}/${state.shorts.length} 처리 시작 ━━━`, "info");
    for (let i = 5; i <= 7; i++) { if (STEPS[i-1].skip) { addLog(`[Step ${i}] ${STEPS[i-1].label} — 건너뜀`, "info"); continue; } await runStep(i); if (document.getElementById("errorBar").style.display !== "none") return; }
  }
  addLog(`\n✅ 전체 완료! ${state.shorts.length}개 쇼츠 생성`, "success");
}

function resetAll() {
  state = { projectId:null, projectStatus:null, shorts:[], activeIdx:0, currentStep:0, loading:false };
  document.getElementById("urlInput").value = ""; hideError(); clearLog(); renderProject(); renderShorts(); updateStepUI();
}

async function resizeShort(idx) {
  const s = state.shorts[idx];
  if (!s) return;
  const ar = document.getElementById(`resizeSel${idx}`).value;
  addLog(`[리사이즈] 쇼츠 #${idx+1} → ${ar}`);
  const d = await apiCall(`${API}/shorts/${s.id}/resize?aspect_ratio=${ar}`, { method:"POST" });
  if (d) { state.shorts = state.shorts.map(x => x.id === s.id ? d : x); addLog(`리사이즈 완료: ${d.output_path}`, "success"); renderShorts(); }
}

renderSteps(); updateStepUI();

// 제목 삽입 토글 라벨 동기화
document.getElementById("withTitle").addEventListener("change", function() {
  document.getElementById("withTitleLabel").textContent = this.checked ? "ON" : "OFF";
});

// ============================================================
// 탭 전환
// ============================================================
function switchTab(tab) {
  document.getElementById("pipelineTab").style.display = tab === "pipeline" ? "flex" : "none";
  document.getElementById("heatmapTab").style.display = tab === "heatmap" ? "flex" : "none";
  document.getElementById("tabPipeline").className = `btn ${tab === "pipeline" ? "btn-primary" : "btn-secondary"}`;
  document.getElementById("tabHeatmap").className = `btn ${tab === "heatmap" ? "btn-primary" : "btn-secondary"}`;
  if (tab === "heatmap") hmLoadFiles();
}

// ============================================================
// 히트맵 수집
// ============================================================
function setHmMode(mode) {
  document.getElementById("hmSingleInput").style.display = mode === "single" ? "block" : "none";
  document.getElementById("hmChannelInput").style.display = mode === "channel" ? "block" : "none";
  document.getElementById("hmModeSingle").className = `btn ${mode === "single" ? "btn-primary" : "btn-secondary"}`;
  document.getElementById("hmModeChannel").className = `btn ${mode === "channel" ? "btn-primary" : "btn-secondary"}`;
}

function hmLog(msg, type="info") {
  const ts = new Date().toLocaleTimeString("ko-KR");
  const el = document.getElementById("hmLogBody");
  el.innerHTML += `<div class="log-line log-${type}"><span class="log-ts">${ts}</span>${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function hmSetLoading(v) {
  document.getElementById("hmLoadingDot").style.display = v ? "inline" : "none";
}

async function hmCollectSingle() {
  const url = document.getElementById("hmUrl").value.trim();
  if (!url) return;
  hmSetLoading(true);
  hmLog(`→ 단일 수집: ${url}`, "request");
  try {
    const res = await fetch(`${API}/heatmap/collect`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({url}) });
    const d = await res.json();
    if (d.status === "collected") {
      hmLog(`✓ ${d.video_id} | ${d.title} | 구간=${d.heatmap_count}, 피크=${d.peak_count}`, "success");
      hmUpdateProgress([d]);
    } else {
      hmLog(`- 스킵 (히트맵 없음 또는 조건 미충족)`, "info");
    }
  } catch(e) { hmLog(`✗ ${e.message}`, "error"); }
  hmSetLoading(false);
  hmLoadFiles();
}

async function hmExtractUrls() {
  const channelUrl = document.getElementById("hmChannelUrl").value.trim();
  const max = +document.getElementById("hmMaxVideos").value;
  if (!channelUrl) return;
  hmSetLoading(true);
  hmLog(`→ URL 추출: ${channelUrl} (최대 ${max}개)`, "request");
  try {
    const res = await fetch(`${API}/heatmap/channel-urls`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({channel_url:channelUrl, max_videos:max}) });
    const d = await res.json();
    if (d.detail) { hmLog(`✗ ${d.detail}`, "error"); hmSetLoading(false); return; }
    document.getElementById("hmUrlTextarea").value = d.urls.join("\n");
    document.getElementById("hmUrlCount").textContent = d.total;
    document.getElementById("hmUrlList").style.display = "block";
    hmLog(`✓ ${d.total}개 URL 추출 완료`, "success");
  } catch(e) { hmLog(`✗ ${e.message}`, "error"); }
  hmSetLoading(false);
}

async function hmCollectBatch() {
  const text = document.getElementById("hmUrlTextarea").value.trim();
  const urls = text.split("\n").map(u=>u.trim()).filter(u=>u && !u.startsWith("#"));
  const rate = +document.getElementById("hmRateLimit").value || 2;
  if (!urls.length) return;
  hmSetLoading(true);
  hmLog(`→ 일괄 수집 시작: ${urls.length}개 URL, rate=${rate}초`, "request");
  document.getElementById("hmProgress").innerHTML = `<p style="color:#f59e0b">0 / ${urls.length} 처리 중...</p>`;
  try {
    const res = await fetch(`${API}/heatmap/collect-batch`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({urls, rate_limit_sec:rate}) });
    const d = await res.json();
    hmLog(`✓ 완료 | 성공:${d.success} 스킵:${d.skipped} 실패:${d.failed} / 전체:${d.total}`, "success");
    hmUpdateProgress(d.results);
    d.results.forEach((r,i) => {
      if (r.status === "collected") hmLog(`  #${i+1} ${r.video_id} — ${r.title}`, "success");
      else if (r.status === "skipped") hmLog(`  #${i+1} 스킵`, "info");
      else hmLog(`  #${i+1} 실패: ${r.title}`, "error");
    });
  } catch(e) { hmLog(`✗ ${e.message}`, "error"); }
  hmSetLoading(false);
  hmLoadFiles();
}

function hmUpdateProgress(results) {
  const s = results.filter(r=>r.status==="collected").length;
  const k = results.filter(r=>r.status==="skipped").length;
  const f = results.filter(r=>r.status==="failed").length;
  document.getElementById("hmProgress").innerHTML = `
    <div style="display:flex;gap:20px;font-size:14px">
      <span style="color:#4ade80">✓ 성공: ${s}</span>
      <span style="color:#94a3b8">- 스킵: ${k}</span>
      <span style="color:#f87171">✗ 실패: ${f}</span>
      <span style="color:#e2e8f0">전체: ${results.length}</span>
    </div>`;
}

async function hmLoadFiles() {
  try {
    const res = await fetch(`${API}/heatmap/results`);
    const d = await res.json();
    const el = document.getElementById("hmFiles");
    if (!d.files.length) { el.innerHTML = '<p class="empty">수집된 파일 없음</p>'; return; }
    el.innerHTML = d.files.map(f => `
      <button class="short-btn" onclick="hmShowFile('${f.filename}')">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="color:#6366f1;font-size:11px">📄</span>
          <span>${f.filename}</span>
        </div>
        <div style="display:flex;gap:12px;font-size:11px;color:#94a3b8">
          <span>${f.video_count}개 영상</span>
          <span>${f.size_kb} KB</span>
        </div>
      </button>
    `).join("");
  } catch(e) { /* 서버 미실행 시 무시 */ }
}

async function hmShowFile(filename) {
  try {
    const res = await fetch(`${API}/heatmap/results/${filename}`);
    const d = await res.json();
    const el = document.getElementById("hmProgress");
    el.innerHTML = `<div class="card-title" style="margin-bottom:8px">${filename} (${d.total}개 영상)</div>` +
      d.entries.map((e,i) => `
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1e293b;font-size:12px">
          <span style="color:#e2e8f0">#${i+1} ${e.title?.slice(0,40) || e.video_id}</span>
          <span style="color:#94a3b8">${Math.floor(e.duration_sec/60)}분 | 구간:${e.heatmap_count} | 피크:${e.peak_count}</span>
        </div>`).join("");
  } catch(e) { hmLog(`✗ ${e.message}`, "error"); }
}
</script>
